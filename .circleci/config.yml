version: '2.1'
orbs:
  node: circleci/node@5.1.0

jobs:
  build-and-test:
    docker:
      - image: cimg/node:24.13.0
    steps:
      - checkout
      - run:
          name: Setup Working Directory
          command: |
            ls -la
            pwd
      - restore_cache:
          name: Restore pnpm Package Cache
          keys:
            - pnpm-packages-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-packages-v1-
      - run:
          name: Install Dependencies
          command: npx pnpm@10.11.0 install --frozen-lockfile
      - save_cache:
          name: Save pnpm Package Cache
          key: pnpm-packages-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - .pnpm-store
            - node_modules
      - run:
          command: |
            npx pnpm@10.11.0 test
            npx pnpm@10.11.0 run typecheck
            npx pnpm@10.11.0 run lint
            npx pnpm@10.11.0 run check:consistency
          name: Verify Dziri Inbox companion and retained consumer modules

workflows:
  test_my_app:
    jobs:
      - build-and-test
